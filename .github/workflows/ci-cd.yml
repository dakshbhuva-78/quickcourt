# CI/CD pipeline for QuickCourt (GitHub Actions)
#  1. build-and-test : runs on every push / pull request  -> compile + JUnit tests + coverage report
#  2. docker-publish : (optional) builds the Docker image and pushes it to Docker Hub
#  3. deploy         : (optional) SSH into the cloud server, pull the new image, restart containers
# Jobs 2 and 3 run only when you create a repository VARIABLE  ENABLE_DEPLOY = true
# and add the secrets listed below (Settings > Secrets and variables > Actions).
name: QuickCourt CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/site/jacoco

  docker-publish:
    needs: build-and-test
    if: ${{ vars.ENABLE_DEPLOY == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quickcourt:latest

  deploy:
    needs: docker-publish
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/quickcourt
            docker compose pull
            docker compose up -d
            docker image prune -f
