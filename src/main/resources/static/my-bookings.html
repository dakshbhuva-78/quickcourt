<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings | QuickCourt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="mybookings">
  <div id="navbar"></div>
  <div class="page-header"><div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <h1 class="h2 mb-0">My bookings</h1>
    <div class="d-flex gap-2">
      <select id="statusFilter" class="form-select" aria-label="Filter by status">
        <option value="">All statuses</option><option>PENDING</option><option>CONFIRMED</option><option>COMPLETED</option><option>CANCELLED</option></select>
      <button class="btn btn-outline-qc" id="exportBtn">Export CSV</button>
    </div></div></div>
  <main class="container mt-4"><div class="row g-3" id="bookingList"><div class="empty">Loading…</div></div></main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
