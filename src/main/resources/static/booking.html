<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a court | QuickCourt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="booking">
  <div id="navbar"></div>
  <div class="page-header"><div class="container"><h1 class="h2 mb-1" id="bkTitle">Book a court</h1><div class="text-muted" id="bkSub"></div></div></div>
  <main class="container mt-4">
    <div class="row g-4">
      <div class="col-lg-8">
        <h5>1. Choose a court</h5>
        <div class="row g-2 mb-4" id="courtList"><div class="text-muted">Loading…</div></div>
        <h5>2. Choose a date</h5>
        <div class="row mb-4"><div class="col-sm-6 col-md-4"><input type="date" id="bkDate" class="form-control" aria-label="Booking date"></div></div>
        <h5>3. Choose a time slot</h5>
        <div id="slotBox" class="slot-grid mb-3"><div class="text-muted">Select a court first.</div></div>
      </div>
      <div class="col-lg-4">
        <div class="summary-card p-4">
          <h5 class="mb-3">Booking summary</h5>
          <dl class="row small mb-3">
            <dt class="col-5 text-muted fw-normal">Venue</dt><dd class="col-7" id="smVenue">-</dd>
            <dt class="col-5 text-muted fw-normal">Court</dt><dd class="col-7" id="smCourt">-</dd>
            <dt class="col-5 text-muted fw-normal">Date</dt><dd class="col-7" id="smDate">-</dd>
            <dt class="col-5 text-muted fw-normal">Time</dt><dd class="col-7" id="smSlot">-</dd>
          </dl>
          <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-3">
            <span class="fw-semibold">Total</span><span class="price fs-4" id="smTotal">₹0</span></div>
          <button class="btn btn-qc w-100" id="confirmBtn" disabled>Confirm &amp; pay</button>
          <div class="form-text mt-2">Payment is simulated. No real money is charged.</div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
