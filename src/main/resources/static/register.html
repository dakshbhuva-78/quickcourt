<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | QuickCourt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="register">
  <div id="navbar"></div>
  <main class="container">
    <div class="auth-card">
      <h2 class="mb-1">Create your account</h2>
      <p class="text-muted">Join QuickCourt as a player or a venue owner.</p>
      <div id="formError" class="alert alert-danger d-none" role="alert"></div>
      <form id="registerForm" novalidate>
        <div class="mb-3"><label class="form-label" for="name">Full name</label>
          <input class="form-control" id="name" maxlength="60" required></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" autocomplete="new-password" required>
          <div class="form-text">At least 8 characters with an upper-case letter, a lower-case letter and a digit.</div></div>
        <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label>
          <input type="password" class="form-control" id="confirm" autocomplete="new-password" required></div>
        <div class="mb-3"><label class="form-label" for="role">I want to</label>
          <select id="role" class="form-select">
            <option value="PLAYER">Book courts (Player)</option>
            <option value="VENUE_OWNER">List my venue (Venue owner)</option>
          </select></div>
        <button class="btn btn-qc w-100" type="submit" id="regBtn">Create account</button>
      </form>
      <p class="mt-3 mb-0 text-center">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
