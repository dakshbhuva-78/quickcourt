<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venues | QuickCourt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="venues">
  <div id="navbar"></div>
  <div class="page-header">
    <div class="container">
      <h1 class="h2 mb-3">Find a venue</h1>
      <form id="filterForm" class="row g-2 align-items-end">
        <div class="col-md-3"><label class="form-label small" for="fQ">Venue name</label><input id="fQ" class="form-control" placeholder="Search by name"></div>
        <div class="col-md-2"><label class="form-label small" for="fSport">Sport</label><select id="fSport" class="form-select"><option value="">All sports</option></select></div>
        <div class="col-md-3"><label class="form-label small" for="fLocation">Location</label><input id="fLocation" class="form-control" placeholder="Area or city"></div>
        <div class="col-md-2"><label class="form-label small" for="fPrice">Max price / hour</label><input id="fPrice" type="number" min="0" class="form-control" placeholder="₹"></div>
        <div class="col-md-2 d-grid"><button class="btn btn-qc" type="submit">Search</button></div>
      </form>
    </div>
  </div>
  <main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div id="resultCount" class="text-muted"></div>
      <div class="d-flex align-items-center gap-2"><label for="fSort" class="small text-muted mb-0">Sort</label>
        <select id="fSort" class="form-select form-select-sm w-auto"><option value="name">Name</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
    </div>
    <div class="row g-4" id="venueList"><div class="empty">Loading…</div></div>
    <nav class="mt-4" aria-label="Pages"><ul class="pagination justify-content-center" id="pager"></ul></nav>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/app.js"></script>
  <script src="js/venues.js"></script>
</body>
</html>
