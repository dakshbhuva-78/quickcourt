# ===== QuickCourt configuration =====
# Every value can be overridden with an ENVIRONMENT VARIABLE (see ${NAME:default}).
# Never commit real passwords. Use env vars or application-local.properties (git-ignored).

spring.application.name=quickcourt
server.port=${PORT:8080}
server.error.include-message=always

# ----- MySQL -----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quickcourt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# update = Hibernate creates/updates tables automatically (fine for a college project)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Dates as "2026-11-25" instead of numbers
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Monitoring (cloud requirement): /actuator/health and /actuator/metrics -----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ----- QuickCourt options -----
quickcourt.seed.enabled=${SEED_DATA:true}
quickcourt.log.dir=${LOG_DIR:logs}
quickcourt.export.dir=${EXPORT_DIR:exports}
quickcourt.report.dir=${REPORT_DIR:reports}
