# Used only by automated tests: in-memory H2 database, no MySQL needed.
spring.datasource.url=jdbc:h2:mem:quickcourt_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
quickcourt.seed.enabled=false
quickcourt.log.dir=target/test-output/logs
quickcourt.export.dir=target/test-output/exports
quickcourt.report.dir=target/test-output/reports
